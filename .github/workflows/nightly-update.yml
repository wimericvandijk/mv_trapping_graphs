name: Nightly Data Refresh

on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-data-refresh
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    env:
      TRAPNZ_API_KEY: ${{ secrets.TRAPNZ_API_KEY }}
      TRAPNZ_PROJECT_ID: ${{ secrets.TRAPNZ_PROJECT_ID }}
      BIRD_SHEETS_SPREADSHEET_ID: ${{ secrets.BIRD_SHEETS_SPREADSHEET_ID }}
      BIRD_SHEETS_RANGE: ${{ secrets.BIRD_SHEETS_RANGE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore detailed annual cache
        id: restore-review-cache
        uses: actions/cache/restore@v4
        with:
          path: data/review/annual
          key: review-annual-${{ github.run_id }}
          restore-keys: |
            review-annual-

      - name: Refresh from recent API data
        if: hashFiles('data/review/annual/all_data.csv') != ''
        run: python scripts/import/import_trapnz_csv.py --merge-recent --publish

      - name: Bootstrap from full API import
        if: hashFiles('data/review/annual/all_data.csv') == ''
        run: |
          python scripts/import/import_trapnz_csv.py -q trap_list -q all_records
          python scripts/transform/annualise_csv.py
          python scripts/publish/publish_to_json.py

      - name: Prepare bird import credentials
        shell: bash
        env:
          BIRD_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.BIRD_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          bird_config_issues=""
          service_account_secret_normalized=$(printf '%s' "$BIRD_GOOGLE_SERVICE_ACCOUNT_JSON" | tr '[:upper:]' '[:lower:]')
          spreadsheet_id_normalized=$(printf '%s' "$BIRD_SHEETS_SPREADSHEET_ID" | tr '[:upper:]' '[:lower:]')
          sheet_range_normalized=$(printf '%s' "$BIRD_SHEETS_RANGE" | tr '[:upper:]' '[:lower:]')

          if [ -z "$BIRD_GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ "$service_account_secret_normalized" = "blank" ]; then
            bird_config_issues="BIRD_GOOGLE_SERVICE_ACCOUNT_JSON"
            echo "BIRD_GOOGLE_SERVICE_ACCOUNT_FILE=" >> "$GITHUB_ENV"
          else
            bird_service_account_file="$RUNNER_TEMP/bird-google-service-account.json"
            printf '%s' "$BIRD_GOOGLE_SERVICE_ACCOUNT_JSON" > "$bird_service_account_file"
            echo "BIRD_GOOGLE_SERVICE_ACCOUNT_FILE=$bird_service_account_file" >> "$GITHUB_ENV"
          fi

          if [ -z "$BIRD_SHEETS_SPREADSHEET_ID" ] || [ "$spreadsheet_id_normalized" = "blank" ]; then
            bird_config_issues="${bird_config_issues:+$bird_config_issues, }BIRD_SHEETS_SPREADSHEET_ID"
            echo "BIRD_SHEETS_SPREADSHEET_ID=" >> "$GITHUB_ENV"
          fi

          if [ -z "$BIRD_SHEETS_RANGE" ] || [ "$sheet_range_normalized" = "blank" ]; then
            bird_config_issues="${bird_config_issues:+$bird_config_issues, }BIRD_SHEETS_RANGE"
            echo "BIRD_SHEETS_RANGE=" >> "$GITHUB_ENV"
          fi

          if [ -n "$bird_config_issues" ]; then
            echo "Bird import is using missing or placeholder configuration: $bird_config_issues"
          fi

          echo "BIRD_IMPORT_CONFIG_ISSUES=$bird_config_issues" >> "$GITHUB_ENV"

      - name: Install bird import dependency
        run: python -m pip install google-auth

      - name: Refresh bird data
        id: refresh-bird-data
        continue-on-error: true
        run: python scripts/import/import_bird_sightings.py --publish

      - name: Record bird import result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.refresh-bird-data.outcome }}" = "failure" ]; then
            if [ -n "$BIRD_IMPORT_CONFIG_ISSUES" ]; then
              echo "::warning title=Bird import failed::scripts/import/import_bird_sightings.py failed with missing or placeholder configuration: $BIRD_IMPORT_CONFIG_ISSUES. See the 'Refresh bird data' step for details."
            else
              echo "::warning title=Bird import failed::scripts/import/import_bird_sightings.py failed. See the 'Refresh bird data' step for details."
            fi
            {
              echo "## Bird import"
              echo ""
              echo "- Status: failed"
              echo "- Command: python scripts/import/import_bird_sightings.py --publish"
              echo "- Required script env/config keys: BIRD_GOOGLE_SERVICE_ACCOUNT_FILE, BIRD_SHEETS_SPREADSHEET_ID, BIRD_SHEETS_RANGE"
              echo "- Recommended GitHub Actions secret for the JSON credential body: BIRD_GOOGLE_SERVICE_ACCOUNT_JSON"
              if [ -n "$BIRD_IMPORT_CONFIG_ISSUES" ]; then
                echo "- Workflow detected missing or placeholder secrets: $BIRD_IMPORT_CONFIG_ISSUES"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Bird import"
            echo ""
            echo "- Status: succeeded"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save detailed annual cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/review/annual
          key: review-annual-${{ github.run_id }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit refreshed site data
        run: |
          mkdir -p /tmp/site-data
          cp site/data/metadata.json /tmp/site-data/metadata.json
          cp site/data/weekly.json /tmp/site-data/weekly.json
          cp site/data/yearly_comparison.json /tmp/site-data/yearly_comparison.json
          cp site/data/summary.json /tmp/site-data/summary.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/site-data/metadata.json site/data/metadata.json
          cp /tmp/site-data/weekly.json site/data/weekly.json
          cp /tmp/site-data/yearly_comparison.json site/data/yearly_comparison.json
          cp /tmp/site-data/summary.json site/data/summary.json

          git add site/data/metadata.json site/data/weekly.json site/data/yearly_comparison.json site/data/summary.json
          if git diff --cached --quiet; then
            echo "No site data changes to commit"
            exit 0
          fi
          git commit -m "Nightly data refresh"
          git push origin HEAD:main